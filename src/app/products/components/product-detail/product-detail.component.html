<div class="card app-product-card" (click)="openModal(product)">
    <img [src]="product.imageUrl" class="card-img-top" alt="{{ product.name }}">
    <div class="card-body">
        <h5 class="card-title">{{ product.name }}</h5>
        <p class="card-text">{{ product.price | currency}}</p>
    </div>
</div>

<!-- Modal (Hidden by default) -->
<div class="modal fade" tabindex="-1" [ngClass]="{'show': showModal}" (click)="closeModal()">
    <div class="modal-dialog" (click)="$event.stopPropagation()">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ selectedProduct?.name }}</h5>
                <button type="button" class="close" (click)="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-body-content">
                    <!-- Image Section -->
                    <div class="modal-image">
                        <img [src]="selectedProduct?.imageUrl" class="img-fluid" alt="{{ selectedProduct?.name }}">
                    </div>

                    <!-- Product Details Section -->
                    <div class="modal-details">
                        <p>{{ selectedProduct?.description }}</p>
                        <p><strong>{{ selectedProduct?.price | currency }}</strong></p>
                        <button class="btn btn-primary" (click)="addToCart(selectedProduct)">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
