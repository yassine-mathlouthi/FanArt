<app-header></app-header>


<div class="container mt-5">
  <div class="row">
    <div class="col">
      <div class="curve">
        <canvas baseChart 
                [data]="chartData" 
                [options]="chartOptions" 
                [type]="chartType">
        </canvas>
      </div>
    </div>
  </div>
  <h2>Actif sotores</h2>
  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
      <!-- ID Column -->
      <ng-container matColumnDef="idArtisan">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let element">{{ element.idArtisan }}</td>
      </ng-container>
  
      <!-- Nom Column -->
      <ng-container matColumnDef="nom">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th>
        <td mat-cell *matCellDef="let element">{{ element.nom }}</td>
      </ng-container>
  
      <!-- Prenom Column -->
      <ng-container matColumnDef="prenom">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Prénom</th>
        <td mat-cell *matCellDef="let element">{{ element.prenom }}</td>
      </ng-container>
  
      <!-- Adresse Boutique Column -->
      <ng-container matColumnDef="adresseBoutique">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Adresse Boutique</th>
        <td mat-cell *matCellDef="let element">{{ element.adresseBoutique }}</td>
      </ng-container>
  
      <!-- Numéro Téléphone Column -->
      <ng-container matColumnDef="numeroTelephone">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Numéro Téléphone</th>
        <td mat-cell *matCellDef="let element">{{ element.numeroTelephone }}</td>
      </ng-container>
  
      <!-- Date Inscription Column -->
      <ng-container matColumnDef="dateInscription">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Date Inscription</th>
        <td mat-cell *matCellDef="let element">{{ element.dateInscription }}</td>
      </ng-container>
  
      <!-- Nom Boutique Column -->
      <ng-container matColumnDef="nomBoutique">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom Boutique</th>
        <td mat-cell *matCellDef="let element">{{ element.nomBoutique }}</td>
      </ng-container>
  
      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button (click)="deleteRow(element.idArtisan)">
            <i class="fas fa-trash icon"></i> 
          </button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
  
</div>
<app-footer></app-footer>
