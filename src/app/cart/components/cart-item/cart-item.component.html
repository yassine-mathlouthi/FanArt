<div class="container shopping-cart-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="shopping-cart-title">Your Shopping Cart</h2>
        <a [routerLink]="['/visitor']" class="btn btn-outline-secondary">Back to Shop</a>
    </div>

    <div class="row">
        <!-- Left side: Product List -->
        <div class="col-lg-8">
            <div *ngFor="let item of cartItems" class="cart-item row align-items-center">
                <div class="col-md-3 col-sm-4 p-0">
                    <img [src]="item.imageUrl || 'assets/placeholder.jpg'" class="img-fluid product-image"
                        alt="{{ item.name }}">
                </div>
                <div class="col-md-4 col-sm-8 cart-item-details">
                    <h5>{{ item.name }}</h5>
                    <p>{{ item.description || 'No description available' }}</p>
                </div>
                <div class="col-md-1 col-sm-4">
                    <select class="form-select form-select-sm" [(ngModel)]="item.quantity">
                        <option *ngFor="let qty of [1, 2, 3, 4, 5]" [value]="qty">{{ qty }}</option>
                    </select>
                </div>
                <div class="col-md-2 col-sm-4 cart-item-price text-end">
                    <p><strong>{{ (item.price * item.quantity) | currency }}</strong></p>
                    <small class="text-muted">{{ item.price | currency }} / per item</small>
                </div>
                <div class="col-md-2 col-sm-4 text-end remove-button-container">
                    <button class="btn btn-remove btn-sm" (click)="confirmRemove(item.id)">Remove</button>
                </div>
            </div>
        </div>

        <!-- Right side: Order Summary -->
        <div class="col-lg-4">
            <div class="order-summary">
                <h4 class="order-summary-title">Order Summary</h4>
                <hr>
                <p>Total Price: <span class="float-end">{{ getTotalPrice() | currency}}</span></p>
                <hr>
                <button class="btn btn-make-purchase w-100 mt-3" [routerLink]="['/checkout']"
                    [disabled]="cartItems.length === 0">
                    Make Purchase
                </button>
            </div>
        </div>
    </div>
</div>
